# 推送到 main 时自动构建并发布到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # 也可以在 GitHub 上手动触发
  workflow_dispatch:

# 允许工作流克隆仓库、开启/写入 Pages、以及用 OIDC 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # enablement: true → 仓库还没开启 Pages 时自动开启（之前部署失败就是因为没开）
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
